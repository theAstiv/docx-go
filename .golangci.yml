# golangci-lint configuration for docx-go.
# See CLAUDE.md "CI / lint rules" for rationale.

version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - goimports       # format / import ordering

linters:
  enable:
    - errcheck        # no silently ignored errors
    - wrapcheck       # errors from external packages must be wrapped
    - nilnil          # catches (nil, nil) return anti-patterns
    - exhaustruct     # enforced on internal/oxml/ — flags missing fields
    - godot           # comment punctuation on exported doc comments
    - forbidigo       # encoding/xml banned in docx/
    - depguard        # three-layer import boundaries
    - gosec           # common security smells
    - staticcheck     # general correctness
    - unused          # unused code
    - misspell        # spelling

  settings:

    forbidigo:
      forbid:
        - pattern: "^encoding/xml\\."
      analyze-types: true
      # Only apply to docx/ package paths.
      # (golangci-lint applies forbidigo globally; the path restriction is done
      # via the 'linters.exclusions.rules' section below.)

    godot:
      # Only check doc comments for exported declarations, not every inline comment.
      scope: declarations

    exhaustruct:
      # Enforce on internal/oxml/ types only; option structs in docx/ are exempt.
      include:
        - "github\\.com/theAstiv/docx-go/internal/oxml/.*"

    depguard:
      # Three-layer architecture — see CLAUDE.md for the rationale.
      # Failure messages include a link so contributors understand WHY.
      rules:
        oxml-layer:
          # internal/oxml/** must NOT import parts, opc, or docx.
          list-mode: lax
          files:
            - "**/internal/oxml/**/*.go"
          deny:
            - pkg: "github.com/theAstiv/docx-go/internal/parts"
              desc: "oxml layer must not import parts — see CLAUDE.md three-layer architecture"
            - pkg: "github.com/theAstiv/docx-go/internal/opc"
              desc: "oxml layer must not import opc — see CLAUDE.md three-layer architecture"
            - pkg: "github.com/theAstiv/docx-go/docx"
              desc: "oxml layer must not import docx — see CLAUDE.md three-layer architecture"

        opc-layer:
          # internal/opc/** must use stdlib only.
          list-mode: lax
          files:
            - "**/internal/opc/**/*.go"
          deny:
            - pkg: "github.com/theAstiv/docx-go/internal/oxml"
              desc: "opc layer must not import oxml — see CLAUDE.md three-layer architecture"
            - pkg: "github.com/theAstiv/docx-go/internal/parts"
              desc: "opc layer must not import parts — see CLAUDE.md three-layer architecture"
            - pkg: "github.com/theAstiv/docx-go/docx"
              desc: "opc layer must not import docx — see CLAUDE.md three-layer architecture"

        docx-layer:
          # docx/ must not reach into oxml internals or opc directly.
          list-mode: lax
          files:
            - "**/docx/**/*.go"
          deny:
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/wml"
              desc: "docx layer must not import wml directly — use parts; see CLAUDE.md"
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/dml"
              desc: "docx layer must not import dml directly — use parts; see CLAUDE.md"
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/registry"
              desc: "docx layer must not import registry — see CLAUDE.md"
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/raw"
              desc: "docx layer must not import raw — see CLAUDE.md"
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/order"
              desc: "docx layer must not import order — see CLAUDE.md"
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/roundtrip"
              desc: "docx layer must not import roundtrip — see CLAUDE.md"
            - pkg: "github.com/theAstiv/docx-go/internal/opc"
              desc: "docx layer must not import opc directly — use parts; see CLAUDE.md"
            - pkg: "encoding/xml"
              desc: "docx layer must not import encoding/xml — enforced by forbidigo too"

    wrapcheck:
      ignore-package-globs:
        - "encoding/*"
        - "archive/*"
        - "os"
        - "io"
        - "fmt"
        # Internal packages are first-party code; wrapcheck is for module-boundary errors.
        - "github.com/theAstiv/docx-go/internal/*"

  exclusions:
    rules:
      # forbidigo encoding/xml restriction applies only to docx/ paths.
      # RE2 has no negative lookahead; enumerate the non-docx directories instead.
      - path: "^(cmd|examples|internal|scripts|tools|testdata)/"
        linters: [forbidigo]
      # exhaustruct is noisy in test files.
      - path: "_test\\.go"
        linters: [exhaustruct]
      # wrapcheck is too strict for cmd/ entry points.
      - path: "^cmd/"
        linters: [wrapcheck]
      # defer f.Close() on input files in CLI tools and examples is intentional;
      # close errors on read-only files are not actionable at the defer call site.
      - path: "^(cmd|examples)/"
        linters: [errcheck]
        text: "Error return value of `.*\\.Close"
      # gosec: cmd/ and examples/ use user-supplied paths and explicit subprocesses
      # by design (G104/G204/G304 + v2 taint rules G702/G703/G706).
      - path: "^(cmd|examples)/"
        linters: [gosec]
      # gosec: golden-test infrastructure and test files read/write computed paths
      # and world-readable artifacts by design (G301/G304).
      - path: "(_test\\.go$|^internal/canon/)"
        linters: [gosec]
