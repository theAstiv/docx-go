# golangci-lint configuration for docx-go. Each linter's line says why it
# is on; docs/architecture.md describes the three-layer architecture the
# depguard rules enforce.

version: "2"

run:
  timeout: 5m
  # Files behind build tags are linted too (the round-trip audit).
  build-tags:
    - roundtripaudit

formatters:
  enable:
    - goimports       # format / import ordering

linters:
  enable:
    - errcheck        # no silently ignored errors
    - wrapcheck       # errors from external packages must be wrapped
    - nilnil          # catches (nil, nil) return anti-patterns
    - exhaustruct_v5  # enforced on internal/oxml/ — flags missing fields
    - godot           # comment punctuation on exported doc comments
    - forbidigo       # encoding/xml banned in docx/
    - depguard        # three-layer import boundaries
    - gosec           # common security smells
    - staticcheck     # general correctness
    - unused          # unused code
    - misspell        # spelling

  settings:

    forbidigo:
      forbid:
        - pattern: "^encoding/xml\\."
      analyze-types: true
      # Only apply to docx/ package paths.
      # (golangci-lint applies forbidigo globally; the path restriction is done
      # via the 'linters.exclusions.rules' section below.)

    godot:
      # Only check doc comments for exported declarations, not every inline comment.
      scope: declarations

    exhaustruct_v5:
      # Enforce on internal/oxml/ types only; option structs in docx/ are exempt.
      # v5 checks every struct literal unless explicit mode is on (v1's include
      # list implied it). Patterns must match the full type name, package path
      # included.
      explicit-mode: true
      enforce-patterns:
        - "github\\.com/theAstiv/docx-go/internal/oxml/.*"

    depguard:
      # Three-layer architecture (docs/architecture.md). Each failure message
      # says why the import is refused.
      #
      # File globs use "**/pkg/**.go", not "**/pkg/**/*.go": the latter needs at
      # least one directory below pkg/, so files directly in docx/ or
      # internal/opc/ never matched and those rules silently never fired.
      rules:
        oxml-layer:
          # internal/oxml/** must NOT import parts, opc, or docx.
          list-mode: lax
          files:
            - "**/internal/oxml/**.go"
          deny:
            - pkg: "github.com/theAstiv/docx-go/internal/parts"
              desc: "oxml is the element layer and knows nothing about parts or packages (docs/architecture.md)"
            - pkg: "github.com/theAstiv/docx-go/internal/opc"
              desc: "oxml is the element layer and knows nothing about ZIP or relationships (docs/architecture.md)"
            - pkg: "github.com/theAstiv/docx-go/docx"
              desc: "oxml is the element layer and must not depend on the public API (docs/architecture.md)"

        opc-layer:
          # internal/opc/** must use stdlib only.
          list-mode: lax
          files:
            - "**/internal/opc/**.go"
          deny:
            - pkg: "github.com/theAstiv/docx-go/internal/oxml"
              desc: "opc handles ZIP, content types and relationships only, with the standard library (docs/architecture.md)"
            - pkg: "github.com/theAstiv/docx-go/internal/parts"
              desc: "opc sits below parts; parts imports opc, not the other way round (docs/architecture.md)"
            - pkg: "github.com/theAstiv/docx-go/docx"
              desc: "opc must not depend on the public API (docs/architecture.md)"

        docx-layer:
          # docx/ may use parts, internal/oxml/wml (to construct element
          # types; no encoding/xml calls), internal/oxml/docprops (property
          # names) and internal/textmerge (Replace), but no other oxml
          # internals and not opc directly.
          list-mode: lax
          files:
            - "**/docx/**.go"
          deny:
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/dml"
              desc: "docx must not build DrawingML directly; go through parts or wml (docs/architecture.md)"
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/registry"
              desc: "the element registry is internal to oxml (docs/architecture.md)"
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/raw"
              desc: "raw elements are the oxml passthrough; docx works on typed elements only (docs/architecture.md)"
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/order"
              desc: "child ordering is oxml's job; use the wml setters (docs/architecture.md)"
            - pkg: "github.com/theAstiv/docx-go/internal/oxml/roundtrip"
              desc: "roundtrip is a test helper for oxml types (docs/architecture.md)"
            - pkg: "github.com/theAstiv/docx-go/internal/opc"
              desc: "docx reaches the package through parts, never opc directly (docs/architecture.md)"
            - pkg: "encoding/xml"
              desc: "docx layer must not import encoding/xml — enforced by forbidigo too"

        template-engine:
          # internal/template works on wml trees only; the package graph and the
          # public proxies reach it through docx/internal/bridge.
          list-mode: lax
          files:
            - "**/internal/template/**.go"
          deny:
            - pkg: "github.com/theAstiv/docx-go/internal/parts"
              desc: "template engine must not import parts — see docs/architecture.md (templating)"
            - pkg: "github.com/theAstiv/docx-go/internal/opc"
              desc: "template engine must not import opc — see docs/architecture.md (templating)"
            - pkg: "github.com/theAstiv/docx-go/docx"
              desc: "template engine must not import docx — see docs/architecture.md (templating)"

        textmerge:
          # internal/textmerge works on wml trees only; it is shared by the
          # template engine and docx.Replace, so it must not depend on either.
          list-mode: lax
          files:
            - "**/internal/textmerge/**.go"
          deny:
            - pkg: "github.com/theAstiv/docx-go/internal/parts"
              desc: "textmerge must not import parts — wml trees only"
            - pkg: "github.com/theAstiv/docx-go/internal/opc"
              desc: "textmerge must not import opc — wml trees only"
            - pkg: "github.com/theAstiv/docx-go/docx"
              desc: "textmerge must not import docx — wml trees only"
            - pkg: "github.com/theAstiv/docx-go/internal/template"
              desc: "textmerge must not import the template engine — it is shared by it"

    wrapcheck:
      ignore-package-globs:
        - "encoding/*"
        - "archive/*"
        - "os"
        - "io"
        - "fmt"
        # Internal packages are first-party code; wrapcheck is for module-boundary errors.
        - "github.com/theAstiv/docx-go/internal/*"

  exclusions:
    rules:
      # forbidigo encoding/xml restriction applies only to docx/ paths.
      # RE2 has no negative lookahead; enumerate the non-docx directories instead.
      - path: "^(cmd|examples|internal|scripts|tools|testdata)/"
        linters: [forbidigo]
      # exhaustruct is noisy in test files.
      - path: "_test\\.go"
        linters: [exhaustruct_v5]
      # wrapcheck is too strict for cmd/ entry points.
      - path: "^cmd/"
        linters: [wrapcheck]
      # defer f.Close() on input files in CLI tools and examples is intentional;
      # close errors on read-only files are not actionable at the defer call site.
      - path: "^(cmd|examples)/"
        linters: [errcheck]
        text: "Error return value of `.*\\.Close"
      # gosec: cmd/ and examples/ use user-supplied paths and explicit subprocesses
      # by design (G104/G204/G304 + v2 taint rules G702/G703/G706).
      - path: "^(cmd|examples)/"
        linters: [gosec]
      # gosec: golden-test infrastructure and test files read/write computed paths
      # and world-readable artifacts by design (G301/G304).
      - path: "(_test\\.go$|^internal/canon/)"
        linters: [gosec]
