name: ci

# The checks every change must pass. Their job names (lint, test (…),
# validate, libreoffice) are the required status checks of the ruleset on
# main: renaming a job breaks the ruleset. Nightly fuzzing (fuzz.yml) and
# benchmarks (bench.yml) have their own triggers and stay separate.
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  # Every pull request, with no path filter: a required check that never
  # runs (a docs-only PR outside a path list) would block the PR forever.
  pull_request:

# A new push to a pull request cancels its superseded run; runs on main are
# never cancelled, so every merge commit is checked in full.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: no job writes to the repository, issues or PRs.
permissions:
  contents: read

# Third-party actions are pinned by commit SHA (the tag in the comment is
# for readers; Dependabot updates both), so a moved or compromised tag
# cannot change what runs. Tool versions installed with go run/install are
# pinned for the same reason.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # setup-go v6+ sets GOTOOLCHAIN=local, so the runner's Go must be new
          # enough to build the pinned staticcheck (requires Go >= 1.26).
          go-version: stable

      # Linter versions are pinned so new lint rules cannot fail CI unannounced.
      # Bump deliberately, and upgrade your local install in the same change:
      # an older local linter passes code that CI rejects.
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.2.2"
          install-go: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  # Known vulnerabilities in reachable code, including the Go standard
  # library. Not a required check: a new stdlib advisory should be fixed
  # promptly, but it must not block unrelated pull requests.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    strategy:
      matrix:
        # The go.mod minimum and the release after it, plus the two
        # supported Go releases (stable, oldstable).
        go: ["1.23", "1.24", "oldstable", "stable"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=roundtripaudit ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      - name: test (roundtripaudit)
        run: go test -tags=roundtripaudit ./...

      - name: coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24'
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24'
        with:
          files: coverage.out

  # OOXML schema validation: re-saved fixtures must gain no errors, and
  # documents docx-go generates must be schema-clean.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('tools/validator/**') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build validator container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/validator
          tags: docx-go-validator:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Validate corpus (delta — round-trip must not introduce new errors)
        run: bash scripts/validate-corpus.sh --delta

      - name: Validate generated documents (must be schema-clean)
        run: bash scripts/validate-generated.sh

  # LibreOffice must open (convert to PDF) both the re-saved fixtures and the
  # documents docx-go generates. Part of the Phase 3 exit gate (P3.G3); Word
  # and Google Docs remain manual checks.
  libreoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache-lo
          key: ${{ runner.os }}-buildx-lo-${{ hashFiles('tools/libreoffice/**') }}
          restore-keys: ${{ runner.os }}-buildx-lo-

      - name: Build LibreOffice container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/libreoffice
          tags: docx-go-libreoffice:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache-lo
          cache-to: type=local,dest=/tmp/.buildx-cache-lo-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache-lo
          mv /tmp/.buildx-cache-lo-new /tmp/.buildx-cache-lo

      - name: Re-save fixtures and generate documents
        run: |
          bash scripts/save-fixtures.sh
          bash scripts/generate-docs.sh

      - name: Convert to PDF with LibreOffice
        run: bash scripts/libreoffice-smoke.sh testdata/golden/docx tmp/generated

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libreoffice-pdfs
          path: tmp/pdf/
          if-no-files-found: ignore
