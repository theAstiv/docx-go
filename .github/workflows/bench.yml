name: bench

on:
  pull_request:
    paths:
      - "testdata/bench/**"
      - "**/*_bench_test.go"
      - "**/*bench*_test.go"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Bench (PR)
        run: go test -bench=. -benchmem -count=6 ./... | tee new.txt

      - name: Checkout base
        run: git checkout ${{ github.base_ref }}

      - name: Bench (base)
        run: go test -bench=. -benchmem -count=6 ./... | tee baseline.txt

      - name: benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          benchstat baseline.txt new.txt
