name: validator

on:
  push:
    paths:
      - "**/*.go"
      - "testdata/fixtures/**"
      - "tools/validator/**"
  pull_request:
    paths:
      - "**/*.go"
      - "testdata/fixtures/**"
      - "tools/validator/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('tools/validator/**') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build validator container
        uses: docker/build-push-action@v7
        with:
          context: tools/validator
          tags: docx-go-validator:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Validate corpus (delta — round-trip must not introduce new errors)
        run: bash scripts/validate-corpus.sh --delta

      - name: Validate generated documents (must be schema-clean)
        run: bash scripts/validate-generated.sh
