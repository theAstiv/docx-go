name: fuzz

on:
  schedule:
    - cron: "0 2 * * *"   # nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Fuzz registered oxml types
        run: |
          # Fuzz each function for 5 minutes. Every target runs even after a
          # failure; the step fails at the end if any target found a crash.
          # Crash inputs are saved to <package>/testdata/fuzz/ by go test.
          failed=0
          fuzz() { go test -run='^$' -fuzz="^$1\$" -fuzztime=5m "$2" || failed=1; }
          # Name each fuzz function explicitly: -fuzz must match exactly one.
          fuzz FuzzCT_P ./internal/oxml/wml
          fuzz FuzzCT_R ./internal/oxml/wml
          # dml: inline pictures (Phase 3a).
          fuzz FuzzCT_Inline ./internal/oxml/dml
          fuzz FuzzCT_Picture ./internal/oxml/dml
          # template: placeholder normalizer and the whole engine (Phase 3b).
          fuzz FuzzTemplateScan ./internal/template
          fuzz FuzzTemplateExecute ./internal/template
          exit "$failed"

      # Committed seeds are tracked; a crash input go test writes is not.
      - name: Collect new crash inputs
        if: always()
        run: |
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | while read -r f; do
            mkdir -p "fuzz-crashers/$(dirname "$f")"
            cp "$f" "fuzz-crashers/$f"
          done

      - name: Upload crash inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: fuzz-crashers/
          if-no-files-found: ignore
