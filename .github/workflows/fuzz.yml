name: fuzz

on:
  schedule:
    - cron: "0 2 * * *"   # nightly at 02:00 UTC
  workflow_dispatch:

# Read-only token: no job writes to the repository, issues or PRs.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24"

      # The corpus each run builds (in GOCACHE/fuzz) is kept between nightly
      # runs, so fuzzing picks up where it stopped instead of starting over.
      - name: Restore fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz every target
        run: |
          # Every Fuzz function in the module is found here, so a new target
          # cannot be left out of the nightly run. Each one runs for 5
          # minutes, even after another failed; the step fails at the end if
          # any target found a crash. Crash inputs are saved to
          # <package>/testdata/fuzz/ by go test.
          failed=0
          # A short -fuzzminimizetime: the default spends 60s minimizing every
          # new input, which leaves most of the 5 minutes unused on the slower
          # whole-package targets.
          fuzz() { go test -run='^$' -fuzz="^$1\$" -fuzztime=5m -fuzzminimizetime=5s "$2" || failed=1; }
          targets=$(grep -rHoE --include='*_test.go' '^func Fuzz[A-Za-z0-9_]+' . | awk -F':func ' '{ d = $1; sub("/[^/]+$", "", d); print $2, d }' | sort -u)
          if [ -z "$targets" ]; then echo "no fuzz targets found"; exit 1; fi
          echo "$targets"
          while read -r name dir; do
            fuzz "$name" "$dir"
          done <<< "$targets"
          exit "$failed"

      # Committed seeds are tracked; a crash input go test writes is not.
      - name: Collect new crash inputs
        if: always()
        run: |
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | while read -r f; do
            mkdir -p "fuzz-crashers/$(dirname "$f")"
            cp "$f" "fuzz-crashers/$f"
          done

      - name: Upload crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: fuzz-crashers/
          if-no-files-found: ignore
