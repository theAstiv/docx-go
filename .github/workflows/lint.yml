name: lint

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          # setup-go v6+ sets GOTOOLCHAIN=local, so the runner's Go must be new
          # enough to build staticcheck@latest (requires Go >= 1.26).
          go-version: stable

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
